# Tiny Tapeout project information (1x1 Tile Template v6)
project:
  title: "Hardware-Native Analog LLM Tile (GQA + RC-Gilbert + BiCtx-Gilbert)"
  author: "Omar Aflak"
  discord: "omaraflak"
  description: "130nm Mixed-Signal Analog LLM Compute Core with 6-bit Differential Crossbar TIAs, 8-bit Auto-Zero Trim DACs, Direct KCL Virtual-Ground Skip, Switched-Capacitor KV/RC Memory, and Gilbert/BJT Softmax"
  language: "Analog"
  clock_hz: 1000000

  tiles: "1x1"
  top_module: "tt_um_alm"

  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: "spi_sclk (Serial clock for 6-bit conductance & 8-bit Trim DAC configuration)"
  ui[1]: "spi_mosi (Serial data input for tile weights and trim registers)"
  ui[2]: "spi_cs_n (Active-low SPI chip select)"
  ui[3]: "cal_auto_zero_en (Grounds wordlines V_in=0V and latches 8-bit Auto-Zero Trim DACs)"
  ui[4]: "tile_mode_0 (0=Crossbar+KCL-Skip TIA, 1=Switched-Cap GQA+RC Bypass)"
  ui[5]: "tile_mode_1 (0=Emitter-Coupled Softmax, 1=RC-BiCtx-Gilbert Bilinear FFN)"
  ui[6]: "sh_sample_en (Switched-capacitor 2.0 pF KV-cache & 1-pole RC sample strobe)"
  ui[7]: "sar_adc_start (Triggers on-tile 8-bit SAR readout ADC)"

  # Outputs
  uo[0]: "spi_miso (Serial readback of trim DACs & calibration status)"
  uo[1]: "sar_adc_eoc (End-of-conversion flag from readout ADC)"
  uo[2]: "adc_out_0 (Digitized analog column voltage bit 0)"
  uo[3]: "adc_out_1 (Digitized analog column voltage bit 1)"
  uo[4]: "adc_out_2 (Digitized analog column voltage bit 2)"
  uo[5]: "adc_out_3 (Digitized analog column voltage bit 3)"
  uo[6]: "adc_out_4 (Digitized analog column voltage bit 4)"
  uo[7]: "adc_out_5 (Digitized analog column voltage bit 5)"

  # Bidirectional pins
  uio[0]: "addr_or_adc_6 (Row/column address bit 0 or ADC bit 6)"
  uio[1]: "addr_or_adc_7 (Row/column address bit 1 or ADC bit 7)"
  uio[2]: "wordline_dac_0 (Input DAC / wordline slot index bit 0)"
  uio[3]: "wordline_dac_1 (Input DAC / wordline slot index bit 1)"
  uio[4]: "wordline_dac_2 (Input DAC / wordline slot index bit 2)"
  uio[5]: "wordline_dac_3 (Input DAC / wordline slot index bit 3)"
  uio[6]: "wordline_dac_4 (Input DAC / wordline slot index bit 4)"
  uio[7]: "uio_dir_sel (0=DAC/address input mode, 1=SAR ADC readout mode)"

# Do not change!
yaml_version: 6
